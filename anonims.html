body.alt #b2{opacity:1}
.veil{position:fixed;inset:0;background:rgba(255,255,255,.18)}
#app{position:relative;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{text-align:center;padding:14px 16px 6px}
header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.3px}
header p{margin:2px 0 0;font-size:13px;font-weight:700;color:var(--mute)}
main{flex:1;overflow-y:auto;padding:8px 16px 110px;-webkit-overflow-scrolling:touch}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1.5px solid var(--edge);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.9)}
.card{border-radius:28px;padding:18px;margin-bottom:14px}
h2{font-size:26px;font-weight:900;margin:6px 2px 12px;letter-spacing:-.4px}
h3{font-size:17px;font-weight:800;margin:0 0 10px}
.btn{border-radius:999px;padding:13px 20px;font:800 15px inherit;font-family:inherit;color:var(--ink);cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.35));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid var(--edge);box-shadow:0 6px 18px rgba(60,80,140,.16),inset 0 1px 0 #fff;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.main{background:linear-gradient(180deg,rgba(130,160,145,.95),rgba(95,125,112,.9));color:#fff;border-color:rgba(255,255,255,.6)}
.btn.sm{padding:8px 14px;font-size:13px}
input,textarea{width:100%;font:600 16px inherit;font-family:inherit;color:var(--ink);background:rgba(255,255,255,.55);border:1.5px solid var(--edge);border-radius:18px;padding:13px 15px;outline:none}
input:focus,textarea:focus,.btn:focus-visible,nav button:focus-visible{outline:3px solid rgba(95,125,112,.55);outline-offset:2px}
textarea{resize:none;min-height:110px}
::placeholder{color:#7e8a90}
.row{display:flex;gap:10px;align-items:center}
.stats{display:flex;gap:10px}.stats>div{flex:1}
.big{font-size:54px;font-weight:900;line-height:1;letter-spacing:-2px}
.lbl{font-size:14px;font-weight:700;color:var(--mute);margin-top:4px}
.ava{width:92px;height:92px;border-radius:50%;flex:none;background:rgba(255,255,255,.6) center/cover;border:2px solid #fff;display:grid;place-items:center;position:relative;cursor:pointer;color:var(--mute)}
.ava i{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.note{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;margin-bottom:8px;font-weight:600;background:rgba(255,255,255,.5);border:1px solid var(--edge)}
.note small{display:block;color:var(--mute);font-weight:700;font-size:12px;margin-bottom:2px}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;line-height:1}
.lined{background:repeating-linear-gradient(transparent 0 31px,rgba(95,125,160,.35) 31px 32px),rgba(255,255,255,.55);background-attachment:local;line-height:32px;padding:0 16px;min-height:224px;border-radius:18px;font-size:17px;font-weight:500}
.emos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.emo{border-radius:22px;padding:12px 2px 9px;text-align:center;font:800 12px inherit;font-family:inherit;color:var(--ink);cursor:pointer;border:1.5px solid var(--edge);background:var(--c);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.emo b{display:block;font-size:30px;margin-bottom:4px;font-weight:400}
.emo.on{outline:3px solid var(--acc);transform:translateY(-3px);box-shadow:var(--sh)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--c);font-size:12px;font-weight:800;margin-bottom:4px}
.ring{width:210px;height:210px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,.25));border:2px solid #fff;box-shadow:var(--sh)}
.mile{display:flex;flex-wrap:wrap;gap:8px}.mile span{padding:7px 13px;border-radius:99px;font-weight:800;font-size:13px;background:rgba(255,255,255,.4);border:1px solid var(--edge);color:var(--mute)}.mile .ok{background:var(--acc);color:#fff}
.breath{width:120px;height:120px;border-radius:50%;margin:14px auto;display:grid;place-items:center;font-weight:800;background:radial-gradient(circle,#fff,rgba(150,190,235,.5));border:2px solid #fff;transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.5)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(456px,calc(100% - 24px));display:flex;border-radius:36px;padding:7px;z-index:5}
nav button{flex:1;border:0;background:none;border-radius:28px;padding:9px 0 7px;font:800 11px inherit;font-family:inherit;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.25s}
nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#4d675b;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.4));box-shadow:0 4px 14px rgba(60,80,120,.15),inset 0 1px 0 #fff}
nav button.on svg{fill:rgba(111,132,120,.35)}
.empty{color:var(--mute);font-weight:600;text-align:center;padding:10px}
a.btn{display:inline-block;text-decoration:none}
</style></head><body>
<div class="bg" id="b1"></div><div class="bg" id="b2"></div><div class="veil"></div>
<div id="app"><header><h1 id="ttl"></h1><p id="sub"></p></header><main id="main"></main></div>
<nav class="glass" id="nav"></nav>
<script>
const mem={};
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const days=()=>{const d=S.get('start',null);if(!d)return 0;const a=new Date(d+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.max(0,Math.round((n-a)/864e5))};
const ic={
p:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>',
d:'<svg viewBox="0 0 24 24"><path d="M2 5c3-1 7-1 10 2 3-3 7-3 10-2v14c-3-1-7-1-10 2-3-3-7-3-10-2z"/><path d="M12 7v14"/></svg>',
e:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M8 14c1 2 2.5 3 4 3s3-1 4-3z"/><path d="M9 9.5v.5M15 9.5v.5"/></svg>',
c:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
s:'<svg viewBox="0 0 24 24"><path d="M12 20.5S3 15 3 8.8C3 6 5 4 7.5 4c1.9 0 3.5 1 4.5 2.6C13 5 14.600 4 16.500 4 19 4 21 6 21 8.800c0 6.200-9 11.700-9 11.700z"/></svg>'};
const tabs=[['p','Профиль','Моё пространство'],['d','Дневник','Личные записи'],['e','Эмоции','Моё состояние'],['c','Чистота','Счётчик дней'],['s','Поддержка','Ты не один']];
let cur=0,emo=null,btimer=null;
$('#nav').innerHTML=tabs.map((t,i)=>`<button data-i="${i}">${ic[t[0]]}${t[1]}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
function go(i){cur=i;clearInterval(btimer);document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',j===i));
$('#ttl').textContent=tabs[i][1];$('#sub').textContent=tabs[i][2];document.body.classList.toggle('alt',i%2===1);
$('#main').innerHTML=[pProfile,pDiary,pEmo,pClean,pSupport][i]();$('#main').scrollTop=0;[bProfile,bDiary,bEmo,bClean,bSupport][i]()}

/* ПРОФИЛЬ */
function pProfile(){const pr=S.get('prof',{}),ach=S.get('ach',[]),d=days();
return `<div class="card glass"><div class="row"><div class="ava" id="ava" style="${pr.photo?`background-image:url(${pr.photo})`:''}">${pr.photo?'':ic.p.replace('<svg','<svg width=40 height=40')}<i class="glass">📷</i></div>
<div style="flex:1"><input id="nick" placeholder="Псевдоним" maxlength="30" value="${esc(pr.nick||'')}"><div class="lbl">Можно оставить пустым</div></div></div>
<input type="file" id="file" accept="image/*" hidden></div>
<div class="stats"><div class="card glass"><div class="big">${d}</div><div class="lbl">дней чистоты</div></div><div class="card glass"><div class="big" style="color:var(--acc)" id="ac">${ach.length}</div><div class="lbl">достижений</div></div></div>
<div class="card glass"><h3>О себе</h3><textarea id="about" placeholder="Дополнительная информация: что для меня важно, что помогает…">${esc(pr.about||'')}</textarea></div>
<div class="card glass"><h3>Вехи</h3><div class="mile">${[1,7,30,60,90,180,365].map(n=>`<span class="${d>=n?'ok':''}">${n} ${n==1?'день':'дн.'}</span>`).join('')}</div></div>
<h2>Мои достижения</h2><div class="card glass"><div class="row"><input id="anew" placeholder="Новое достижение…"><button class="btn main sm" id="aadd">Добавить</button></div></div><div id="alist">${ach.map((a,i)=>`<div class="note"><div><small>${fmt(a.t)}</small>${esc(a.x)}</div><button class="x" data-d="${i}" aria-label="Удалить">×</button></div>`).join('')||'<div class="empty">Здесь будут твои победы — даже маленькие</div>'}</div>`}
function bProfile(){const sv=()=>S.set('prof',{...S.get('prof',{}),nick:$('#nick').value,about:$('#about').value});
$('#nick').oninput=sv;$('#about').oninput=sv;$('#ava').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=300;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,300,300);S.set('prof',{...S.get('prof',{}),photo:c.toDataURL('image/jpeg',.8)});go(0)};im.src=r.result};r.readAsDataURL(f)};
const add=()=>{const v=$('#anew').value.trim();if(!v)return;const a=S.get('ach',[]);a.unshift({x:v,t:Date.now()});S.set('ach',a);go(0)};
$('#aadd').onclick=add;$('#anew').onkeydown=e=>{if(e.key==='Enter')add()};
$('#alist').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const a=S.get('ach',[]);a.splice(+b.dataset.d,1);S.set('ach',a);go(0)}}

/* ДНЕВНИК */
function pDiary(){const l=S.get('diary',[]),dr=S.get('draft','');
return `<div class="card glass"><h3>${fmt(Date.now())}</h3><textarea id="dt" class="lined" placeholder="Что происходило сегодня…">${esc(dr)}</textarea>
<div class="row" style="margin-top:12px"><button class="btn main" id="dsave" style="flex:1">Сохранить запись</button></div></div>
<h2>Последние записи</h2><div id="dl">${l.map((a,i)=>`<div class="note"><div><small>${fmt(a.t)}</small>${esc(a.x).replace(/\n/g,'<br>')}</div><button class="x" data-d="${i}" aria-label="Удалить">×</button></div>`).join('')||'<div class="empty">Пока нет записей</div>'}</div>`}
function bDiary(){$('#dt').oninput=e=>S.set('draft',e.target.value);
$('#dsave').onclick=()=>{const v=$('#dt').value.trim();if(!v)return;const l=S.get('diary',[]);l.unshift({x:v,t:Date.now()});S.set('diary',l);S.set('draft','');go(1)};
$('#dl').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const l=S.get('diary',[]);l.splice(+b.dataset.d,1);S.set('diary',l);go(1)}}

/* ЭМОЦИИ */
const E=[['😢','Грусть','#d9def5'],['😄','Радость','#d2eadf'],['😠','Злость','#f2d6de'],['😰','Тревога','#f4e2cd'],['🌧️','Печаль','#e0d8f2'],['😨','Страх','#d6dbe6'],['🤢','Отвращение','#dfe8c8'],['😲','Удивление','#f6ecc4']];
function pEmo(){const l=S.get('emo',[]);
return `<div class="card glass"><h3>Как я себя чувствую?</h3><div class="emos">${E.map((e,i)=>`<button class="emo ${emo===i?'on':''}" style="--c:${e[2]}" data-i="${i}"><b>${e[0]}</b>${e[1]}</button>`).join('')}</div>
<h3>Что могло вызвать это чувство?</h3><textarea id="et" placeholder="Ситуация, мысль, разговор, воспоминание…"></textarea>
<button class="btn main" id="esave" style="width:100%;margin-top:12px">Сохранить</button></div>
<h2>История</h2><div id="el">${l.map((a,i)=>`<div class="note"><div><small>${new Date(a.t).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</small><span class="tag" style="--c:${E[a.e][2]}">${E[a.e][0]} ${E[a.e][1]}</span><br>${esc(a.x)}</div><button class="x" data-d="${i}" aria-label="Удалить">×</button></div>`).join('')||'<div class="empty">Выбери эмоцию выше</div>'}</div>`}
function bEmo(){document.querySelectorAll('.emo').forEach(b=>b.onclick=()=>{emo=+b.dataset.i;document.querySelectorAll('.emo').forEach(x=>x.classList.toggle('on',x===b))});
$('#esave').onclick=()=>{if(emo===null){$('#esave').textContent='Сначала выбери эмоцию';return}const l=S.get('emo',[]);l.unshift({e:emo,x:$('#et').value.trim(),t:Date.now()});S.set('emo',l);emo=null;go(2)};
$('#el').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const l=S.get('emo',[]);l.splice(+b.dataset.d,1);S.set('emo',l);go(2)}}

/* ЧИСТОТА */
function pClean(){const s=S.get('start',''),d=days(),nx=[1,7,14,30,60,90,180,365,730].find(n=>n>d);
return `<div class="card glass" style="text-align:center"><div class="ring"><div><div class="big" style="font-size:72px">${d}</div><div class="lbl">${['день','дня','дней'][d%100>10&&d%100<15?2:d%10==1?0:d%10>1&&d%10<5?1:2]} чистоты</div></div></div>
${s?`<div class="lbl">С ${fmt(s+'T00:00:00')}${nx?` · до отметки ${nx} дн.: ${nx-d}`:''}</div>`:'<div class="lbl">Укажи дату начала отсчёта</div>'}</div>
<div class="card glass"><h3>Дата начала</h3><input type="date" id="sd" value="${s}" max="${new Date().toISOString().slice(0,10)}">
<div class="row" style="margin-top:12px"><button class="btn main" id="ssave" style="flex:1">Начать отсчёт</button><button class="btn" id="sres">Сбросить</button></div></div>`}
function bClean(){$('#ssave').onclick=()=>{if($('#sd').value){S.set('start',$('#sd').value);go(3)}};$('#sres').onclick=()=>{S.set('start','');go(3)}}

/* ПОДДЕРЖКА */
function pSupport(){const c=S.get('ctc',[]);
return `<div class="card glass" style="text-align:center"><h3>Подышим вместе</h3><div class="breath" id="br">Начать</div><div class="lbl" id="bt">Вдох 4 сек · выдох 4 сек</div></div>
<div class="card glass"><h3>Если накрывает тяга</h3><div class="note" style="margin:0 0 8px">Подожди 15 минут — тяга проходит волнами.</div><div class="note" style="margin:0 0 8px">Выпей воды, выйди на воздух, смени обстановку.</div><div class="note" style="margin:0">Позвони человеку из списка ниже, пока не стало хуже.</div></div>
<div class="card glass"><h3>Мои люди</h3><div class="row" style="flex-wrap:wrap"><input id="cn" placeholder="Имя" style="flex:1 1 120px"><input id="cp" type="tel" placeholder="Телефон" style="flex:1 1 120px"></div><button class="btn main" id="cadd" style="width:100%;margin:12px 0">Добавить</button>
${c.map((a,i)=>`<div class="note"><div><b>${esc(a.n)}</b><small>${esc(a.p)}</small></div><div class="row">${a.p?`<a class="btn sm" href="tel:${esc(a.p)}">Позвонить</a>`:''}<button class="x" data-d="${i}" aria-label="Удалить">×</button></div></div>`).join('')}</div>
<div class="card glass"><h3>Срочная помощь</h3><div class="lbl" style="margin:0 0 10px">При опасности для жизни и передозировке</div><a class="btn main" href="tel:112">Позвонить 112</a></div>`}
function bSupport(){let on=false;const br=$('#br');
br.onclick=()=>{if(btimer){clearInterval(btimer);btimer=null;br.classList.remove('in');br.textContent='Начать';return}
const t=()=>{on=!on;br.classList.toggle('in',on);br.textContent=on?'Вдох':'Выдох'};t();btimer=setInterval(t,4000)};
$('#cadd').onclick=()=>{const n=$('#cn').value.trim();if(!n)return;const c=S.get('ctc',[]);c.push({n,p:$('#cp').value.trim()});S.set('ctc',c);go(4)};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const c=S.get('ctc',[]);c.splice(+b.dataset.d,1);S.set('ctc',c);go(4)})}
go(0);
</script></body></html>
